name: Deploy Pages demo

on:
  push:
    branches: [main]
    paths:
      - "apps/miniapp/**"
      - "assets/design/blackjack-gfl/deck-a/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Mini App for project Pages path
        env:
          BASE_PATH: /BURMALDOZA
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: pnpm --dir apps/miniapp build
      - name: Add interactive Blackjack Deck A preview
        run: |
          target="apps/miniapp/build/design/blackjack-deck-a"
          mkdir -p "$target"
          cp assets/design/blackjack-gfl/deck-a/preview.local.html "$target/index.html"
          cp assets/design/blackjack-gfl/deck-a/sources.json "$target/sources.json"
          cp -R assets/design/blackjack-gfl/deck-a/web "$target/web"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/miniapp/build
      - id: deployment
        uses: actions/deploy-pages@v4
