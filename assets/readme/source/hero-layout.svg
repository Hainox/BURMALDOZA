      <stop offset="0" stop-color="#111216"/>
      <stop offset="1" stop-color="#241316"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#db6a38"/>
      <stop offset="1" stop-color="#f0b189"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d96538" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d96538" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="600" rx="34" fill="url(#bg)"/>
  <rect x="820" y="0" width="620" height="600" rx="34" fill="#35141b" opacity=".72"/>
  <ellipse cx="1145" cy="308" rx="320" ry="300" fill="url(#glow)"/>
  <path d="M72 86H676" stroke="url(#line)" stroke-width="4"/>
  <text x="72" y="140" fill="#f0b189" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="25" font-weight="700" letter-spacing="4">TELEGRAM MINI APP · FOUNDATION</text>
  <text x="72" y="250" fill="#fff7f1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="84" font-weight="800" letter-spacing="-4">БУРМАЛДОЗА</text>
  <text x="72" y="316" fill="#d9cfca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="34">Виртуальная игровая комната</text>
  <text x="72" y="360" fill="#d9cfca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="34">для Telegram-сообщества.</text>
  <text x="72" y="408" fill="#a9a1a0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="24">Mini App · server-first экономика · GitHub Pages demo</text>
  <g transform="translate(72 472)">
