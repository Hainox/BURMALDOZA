  <text x="64" y="292" fill="#a9a1a0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="21">Mini App · server-first экономика · GitHub Pages demo</text>
  <g transform="translate(64 329)">
