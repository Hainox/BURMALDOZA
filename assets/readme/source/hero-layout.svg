<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Бурмалдоза — Telegram Mini App с виртуальной игровой комнатой</title>
  <desc id="desc">Редактируемый SVG-макет hybrid hero: название Бурмалдоза, описание продукта и место для растровой рулетки с осенним листом.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111216"/>
      <stop offset="1" stop-color="#231714"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#db6a38"/>
      <stop offset="1" stop-color="#f0b189"/>
