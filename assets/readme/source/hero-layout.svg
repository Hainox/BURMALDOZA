<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">Бурмалдоза — desktop hero для Telegram Mini App</title>
  <desc id="desc">Широкая desktop-композиция: информация слева, full-body casino-композиция с тремя персонажами справа без растяжения.</desc>
  <defs>
