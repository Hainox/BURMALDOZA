  <text x="64" y="206" fill="#fff7f1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="68" font-weight="800" letter-spacing="-3">БУРМАЛДОЗА</text>
