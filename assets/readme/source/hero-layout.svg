    <rect x="200" width="215" height="40" rx="20" fill="#1f2227" stroke="#474951"/>
    <text x="307" y="26" fill="#d2d5db" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700">NO PAYMENTS IN V1</text>
  </g>
