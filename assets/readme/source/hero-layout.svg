    <rect x="232" width="246" height="48" rx="24" fill="#1f2227" stroke="#474951"/>
    <text x="355" y="31" fill="#d2d5db" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" font-weight="700">NO PAYMENTS IN V1</text>
