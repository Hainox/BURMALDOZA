<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Бурмалдоза — Telegram Mini App с виртуальной игровой комнатой</title>
  <desc id="desc">Чистая типографика слева и прозрачная латунная рулетка с четырьмя диагональными рычажками справа.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111216"/>
      <stop offset="1" stop-color="#231714"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#db6a38"/>
      <stop offset="1" stop-color="#f0b189"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d96538" stop-opacity=".14"/>
      <stop offset="1" stop-color="#d96538" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="470" rx="30" fill="url(#bg)"/>
  <ellipse cx="965" cy="237" rx="248" ry="218" fill="url(#glow)"/>
  <circle cx="1132" cy="52" r="7" fill="#db6a38"/>
  <path d="M64 76H498" stroke="url(#line)" stroke-width="3"/>
  <text x="64" y="119" fill="#f0b189" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="20" font-weight="700" letter-spacing="3">TELEGRAM MINI APP · FOUNDATION</text>
  <text x="64" y="204" fill="#fff7f1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="66" font-weight="800" letter-spacing="-3">БУРМАЛДОЗА</text>
  <text x="64" y="254" fill="#d9cfca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="27">Виртуальная игровая комната</text>
  <text x="64" y="289" fill="#d9cfca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="27">для Telegram-сообщества.</text>
  <text x="64" y="326" fill="#a9a1a0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="20">Mini App · server-first экономика · GitHub Pages demo</text>
  <g transform="translate(64 357)">
    <rect width="186" height="40" rx="20" fill="#2c211e" stroke="#80513b"/>
