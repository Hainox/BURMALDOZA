[project]
name = "burmaldoza"
version = "0.1.0"
description = "Telegram bot and Mini App foundation for the Burmaldoza community game layer"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=6.4,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "apps/bot", "packages/domain/src", "packages/contracts/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
