# Production stack for https://burmaldoza.ru — runbook: docs/Deploy-Production.md
#
#   docker compose -f docker-compose.prod.yml --env-file .env config --quiet   # preflight
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Rules (docs/Launch-Checkpoint.md, R1/R5/R6):
# - Only Caddy publishes ports (80/443). PostgreSQL, Redis, API and Mini App have no `ports`:
#   Docker-published ports bypass ufw, so anything published here is public.
# - Exactly one API process: one Uvicorn worker (explicit --workers 1), one replica, no WEB_CONCURRENCY,
#   while EventBus lives in process memory.
# - Secrets come only from the server .env (chmod 600, never committed). Required values use `:?`
#   so a missing secret stops `compose config` / `up` before anything starts.
# - The Caddyfile is inlined via `configs.content` (Docker Compose >= 2.23.1).

name: burmaldoza

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burmaldoza}
      POSTGRES_USER: ${POSTGRES_USER:-burmaldoza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: [*restart, *logging]
    # Same start as the Dockerfile CMD plus an explicit single worker (R5). Migrations run first.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port 8000 --workers 1"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-burmaldoza}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env}@postgres:5432/${POSTGRES_DB:-burmaldoza}"
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN:?Set the new BotFather token in the server .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN (long random, not equal to BOT_TOKEN) in the server .env}
      MINIAPP_URL: ${MINIAPP_URL:-https://burmaldoza.ru}
      ENVIRONMENT: production
      API_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # load_skeleton_config reads this tracked runtime ruleset; the API image does not copy tests/.
    configs:
      - source: slot_ruleset
        target: /app/tests/fixtures/slot_skeleton.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend, edge]

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    <<: [*restart, *logging]
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set the new BotFather token in the server .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN (long random, not equal to BOT_TOKEN) in the server .env}
      MINIAPP_URL: ${MINIAPP_URL:-https://burmaldoza.ru}
      # BotConfig requires HTTPS in production. Resolve this host to Caddy on the edge network.
      API_BASE_URL: https://burmaldoza.ru
      ENVIRONMENT: production
    depends_on:
      api:
        condition: service_healthy
      caddy:
        condition: service_started
    # Caddy provides HTTPS to the API; edge also allows outbound Telegram Bot API access.
    networks: [edge]

  miniapp:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
      args:
        # Build-time value (R3): an empty value would silently build the DEMO client.
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://burmaldoza.ru}
    <<: [*restart, *logging]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    <<: [*restart, *logging]
    # The only published ports of the stack. 443/udp serves HTTP/3.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      miniapp:
        condition: service_healthy
    networks:
      edge:
        aliases: [burmaldoza.ru]

configs:
  slot_ruleset:
    file: ./tests/fixtures/slot_skeleton.json
  caddyfile:
    # Let's Encrypt certificates are issued automatically once DNS points at the server.
    # /api/* (incl. the WebSocket /api/v1/rooms/{id}/events) and /health* go to the API,
    # everything else to the Mini App. No X-Frame-Options: Telegram Web embeds the Mini App.
    content: |
      burmaldoza.ru {
        encode zstd gzip
        header {
          Strict-Transport-Security "max-age=31536000"
          X-Content-Type-Options "nosniff"
          Referrer-Policy "strict-origin-when-cross-origin"
          -Server
        }
        @api path /api/* /health /health/*
        handle @api {
          reverse_proxy api:8000
        }
        handle {
          reverse_proxy miniapp:8080
        }
      }

      www.burmaldoza.ru, burmaldoza.online, www.burmaldoza.online {
        redir https://burmaldoza.ru{uri} permanent
      }

networks:
  # No outside connectivity: PostgreSQL and Redis are reachable only from api.
  backend:
    internal: true
  edge: {}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
